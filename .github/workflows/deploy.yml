name: Deploy

# Despliega un tag de release en producción con `dploy`, por SSH.
#
# Se dispara al empujar un tag vX.Y.Z, o a mano desde Actions → Deploy → Run workflow
# (así es como se hace un rollback: se indica el tag anterior, p. ej. v3.0.0).
#
# Antes de usarlo, configura en GitHub → Settings:
#
#   Environments → production (con "Required reviewers" si quieres aprobación):
#     DEPLOY_HOST         servidor (IP o dominio)
#     DEPLOY_USER         usuario que ejecuta dploy (el dueño de ~/.dploy)
#     DEPLOY_SSH_KEY      clave privada completa, sin passphrase
#     DEPLOY_PORT         opcional, por defecto 22
#     DEPLOY_KNOWN_HOSTS  opcional pero recomendado: `ssh-keyscan -p 22 HOST`
#
#   Variables (Settings → Secrets and variables → Actions → Variables):
#     DPLOY_BIN           opcional, nombre o ruta del binario (por defecto: dploy)
#     PRODUCTION_URL      opcional, enlace que se muestra en la pestaña Deployments
#
# Notas: se despliegan tags, nunca ramas. dploy crea releases/<fecha>-<ref> y enlaza
# los compartidos con `ln -srn ../../shared/<dir>`; con una rama tipo `upgrade/filament-5`
# la release queda dos niveles dentro y el symlink apunta a releases/shared, así que
# storage/logs no existe y el deploy falla en package:discover.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag a desplegar (v5.1.1, o v3.0.0 para volver atrás)'
        required: true
        type: string
      dry_run:
        description: 'Solo comprobar la conexión SSH, sin desplegar'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Dos despliegues a la vez dejarían el symlink current en un estado indeterminado.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.ref || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      DEPLOY_REF: ${{ inputs.ref || github.ref_name }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DPLOY_BIN: ${{ vars.DPLOY_BIN || 'dploy' }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - name: Validar el tag
        run: |
          set -euo pipefail

          if [[ ! "$DEPLOY_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$DEPLOY_REF' no es un tag de release (formato vX.Y.Z). Solo se despliegan tags."
            exit 1
          fi

          echo "Release a desplegar: $DEPLOY_REF"

      - name: Comprobar que el tag existe
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Preparar SSH
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if [[ -n "${DEPLOY_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS no está definido; se confía en ssh-keyscan."
            ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi

          chmod 600 ~/.ssh/known_hosts

      - name: Desplegar con dploy
        run: |
          set -euo pipefail

          ssh_opts=(
            -i "$HOME/.ssh/deploy_key"
            -p "$DEPLOY_PORT"
            -T
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=30
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
          )
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"

          echo "Comprobando la conexión con ${remote}:${DEPLOY_PORT}…"
          ssh "${ssh_opts[@]}" "$remote" "bash -lc 'command -v ${DPLOY_BIN}'"

          if [[ "$DRY_RUN" == "true" ]]; then
            echo "::notice::dry_run activo: la conexión funciona y no se despliega nada."
            exit 0
          fi

          # -l para que el shell de login cargue el PATH y nvm del usuario del deploy.
          # --no-interaction: en CI no hay terminal donde contestar una pregunta.
          echo "Ejecutando ${DPLOY_BIN} deploy ${DEPLOY_REF}…"
          ssh "${ssh_opts[@]}" "$remote" \
            "bash -lc '${DPLOY_BIN} deploy ${DEPLOY_REF} --no-interaction --no-ansi'"

      - name: Borrar la clave
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Resumen
        if: success() && inputs.dry_run != true
        run: |
          {
            echo "### Desplegado \`$DEPLOY_REF\`"
            echo ""
            echo "Rollback: ejecuta **Deploy** a mano con el tag anterior."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Aviso de rollback
        if: failure()
        run: |
          echo "::warning::El despliegue no se completó. dploy solo cambia el symlink current si la release termina bien; para volver atrás: dploy deploy <tag anterior>."
